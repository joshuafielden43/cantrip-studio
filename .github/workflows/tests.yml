# git-hardening CI template — Python / pytest.
# Dropped in by install-guards.sh --ci python (or --ci auto).
# It's a skeleton: adapt the Python version and the dependency-install step
# to match the repo (pyproject extras, requirements.txt, a Makefile target...).
name: tests
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # Prefer an editable install with a dev extra; fall back to requirements.
          if [ -f pyproject.toml ]; then
            pip install -e ".[dev]" || pip install -e .
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install pytest
      - name: Test
        run: |
          pytest -q
          node still-have-it/test-filter.cjs
