<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FAF6EC">
<meta name="description" content="Cantrip Studio. Small things worth sending.">
<title>Cantrip Studio — Small things worth sending.</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#FAF6EC;color:#001F4D;font-family:Arial,sans-serif}a{color:inherit}
.page{max-width:1240px;margin:auto;min-height:100svh;padding:24px 6vw 18px;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:24px}
.logo{display:block;width:64px;flex-shrink:0}
.logo img{display:block;width:100%;height:auto;mix-blend-mode:multiply}
.name{font-size:16px;letter-spacing:.025em;margin:0;font-weight:600}
main{padding:44px 0 56px;flex:1}
.banner{display:block;width:100%;height:auto;margin:0 0 28px;mix-blend-mode:multiply}
.hero{max-width:850px}
h1{font-family:Georgia,serif;font-weight:400;letter-spacing:-.06em;font-size:calc(clamp(50px,7vw,88px) + 2pt);line-height:1.02;margin:0;color:#0D3D8C;max-width:820px}
h1 span{display:block}
.soft{font-size:17px;line-height:1.65;max-width:450px;margin:28px 0 0;color:#3D5A8C}
.shelf{margin-top:28px;display:flex;align-items:center;gap:32px}
.cantrip{position:relative;display:flex;align-items:center;justify-content:space-between;gap:40px;min-width:270px;height:auto;min-height:44px;padding:10px 28px;background:#0D3D8C;color:#FAF6EC;text-decoration:none;transform:rotate(-2deg);box-shadow:5px 6px 0 #E5E9EE;transition:transform .18s,box-shadow .18s}
.cantrip:hover{transform:rotate(0);box-shadow:3px 3px 0 #C0C0C0}
.cantrip-text{display:flex;flex-direction:column;gap:2px;min-width:0}
.cantrip-title{font-family:Georgia,serif;font-size:20px;line-height:1.1}
.cantrip-sub{font-family:Arial,sans-serif;font-size:12px;font-weight:400;letter-spacing:.02em;opacity:.78;line-height:1.2}
.arrow{font-size:22px;flex-shrink:0}
.bay{font-size:11px;letter-spacing:.12em;color:#3D5A8C;text-transform:uppercase}
footer{padding-top:20px;border-top:1px solid #C0C0C0;text-align:right}
footer a{font-size:10px;text-underline-offset:3px}
a:focus-visible{outline:2px solid #0D3D8C;outline-offset:7px}
@media(max-width:600px){
  .page{padding:16px 24px}.logo{width:52px}header{gap:15px}.name{font-size:15px}
  main{padding-top:56px}h1{font-size:clamp(50px,12vw,72px)}.soft{font-size:15px;max-width:360px}
  .shelf{gap:24px;margin-top:40px}.cantrip{min-width:0;flex:1;padding:10px 20px;gap:12px}
  .cantrip-title{font-size:18px}.cantrip-sub{font-size:11px}
  footer{text-align:left}
}
@media(prefers-reduced-motion:reduce){.cantrip{transition:none}}
</style>
</head>
<body>
<div class="page">
<header>
  <a class="logo" href="mailto:10hoursindustries@gmail.com" aria-label="Email Cantrip Studio"><img src="assets/10hi-logo-04.png" width="240" height="240" alt="10hi"></a>
  <p class="name">Cantrip Studio</p>
</header>
<main>
  <img class="banner" src="assets/cantrip-banner-v2.png" width="2172" height="724" alt="Cantrip Studio — paper envelope releasing a tiny house, bird, spinning top and ribbon in blue and cream.">
  <section class="hero">
    <h1>Small things <span>worth sending.</span></h1>
    <p class="soft">We make little sites — the kind you hand a friend and then get on with your day. Calm house. Simple toys.</p>
  </section>
  <nav class="shelf" aria-label="Cantrips">
    <a class="cantrip" href="still-have-it/">
      <span class="cantrip-text">
        <span class="cantrip-title">STILL HAVE IT</span>
        <span class="cantrip-sub">Had it too long</span>
      </span>
      <span class="arrow" aria-hidden="true">↗</span>
    </a>
    <span class="bay">Next</span>
  </nav>
</main>
<footer><a href="mailto:10hoursindustries@gmail.com">10hoursindustries@gmail.com</a></footer>
</div>
</body>
</html>
